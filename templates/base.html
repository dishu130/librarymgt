<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>College Library Management System</title>
</head>
<body>
    <h1>College Library Management System</h1>
    <nav>
        <form action="{{ url_for('home') }}" method="get" style="display: inline;">
            <button type="submit">Home</button>
        </form>
        <form action="{{ url_for('manage_books') }}" method="get" style="display: inline;">
            <button type="submit">Add and Manage Books</button>
        </form>
        <form action="{{ url_for('issue_book') }}" method="get" style="display: inline;">
            <button type="submit">Issue Book</button>
        </form>
        <form action="{{ url_for('view_issued_books') }}" method="get" style="display: inline;">
            <button type="submit">View Issued Books</button>
        </form>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
