{% extends "base.html" %}

{% block content %}
    <h2>Choose an option:</h2>

    <form action="{{ url_for('manage_books') }}" method="get">
        <button type="submit">Add or Manage Books</button>
    </form>
    <form action="{{ url_for('issue_book') }}" method="get">
        <button type="submit">Issue a Book</button>
    </form>
    <form action="{{ url_for('view_issued_books') }}" method="get">
        <button type="submit">View Issued Books</button>
    </form>
{% endblock %}
