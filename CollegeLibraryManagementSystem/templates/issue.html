{% extends "base.html" %}

{% block content %}
    <h2>Issue Book</h2>

    <form action="{{ url_for('issue_book') }}" method="post">
        <label for="book_id">Select Book:</label>
        <select id="book_id" name="book_id" required>
            <option value="">Select a book</option>
            {% for book in books %}
                <option value="{{ book.id }}">{{ book.name }} by {{ book.author }} ({{ book.quantity }} available)</option>
            {% endfor %}
        </select>
        <br><br>

        <label for="student_name">Student Name:</label>
        <input type="text" id="student_name" name="student_name" required>
        <br><br>

        <label for="roll_number">Student Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number" required>
        <br><br>

        <label for="student_course">Student Course:</label>
        <input type="text" id="student_course" name="student_course" required>
        <br><br>

        <button type="submit">Issue Book</button>
    </form>

    {% if not books %}
        <p>No books are currently available to issue.</p>
    {% endif %}
{% endblock %}
